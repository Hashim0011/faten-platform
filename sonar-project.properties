# ═══════════════════════════════════════════════════════════
#  إعداد تحليل SonarQube — منصة فطن
#  https://docs.sonarsource.com/sonarqube/latest/analyzing-source-code/analysis-parameters/
# ═══════════════════════════════════════════════════════════

sonar.projectKey=faten-platform
sonar.projectName=فطن - منصة الأمن الفكري
sonar.projectVersion=1.0.0

# ── ما يُحلَّل ──
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# ── ما يُستثنى من التحليل كلياً ──
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/reports/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  public/**,\
  **/*.css

# ── ما يُستثنى من حساب التغطية (لا معنى لتغطية نقطة الدخول) ──
sonar.coverage.exclusions=\
  src/main.tsx,\
  src/vite-env.d.ts,\
  **/*.d.ts,\
  tests/**

# ── تقارير خارجية يستوردها Sonar ──
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=reports/sonar-tests.xml
sonar.eslint.reportPaths=reports/eslint-report.json

# ── يساعد Sonar على ربط النتائج بالكود الأصلي ──
sonar.typescript.tsconfigPath=tsconfig.app.json

# ═══════════════════════════════════════════════════════════
#  Clean as You Code — فلسفة Sonar الأساسية
#  الـ Quality Gate يُطبَّق على "الكود الجديد" فقط، لا على
#  الدين التقني الموروث. هكذا يتحسّن المشروع تدريجياً بلا شلل.
# ═══════════════════════════════════════════════════════════
sonar.newCode.referenceBranch=main
