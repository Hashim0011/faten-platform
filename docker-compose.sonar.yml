# ═══════════════════════════════════════════════════════════
#  SonarQube محلي للاستكشاف والتجربة
#
#  التشغيل:   docker compose -f docker-compose.sonar.yml up -d
#  الواجهة:   http://localhost:9000   (admin / admin)
#  الإيقاف:   docker compose -f docker-compose.sonar.yml down
#  حذف الكل:  docker compose -f docker-compose.sonar.yml down -v
# ═══════════════════════════════════════════════════════════
services:
  sonarqube:
    image: sonarqube:10.7.0-community
    container_name: faten-sonarqube
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # SonarQube يشغّل Elasticsearch داخلياً ويحتاج تخطي فحوص النواة على Docker Desktop
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
    ports:
      - '9000:9000'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9000/api/system/status | grep -q UP']
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s

  db:
    image: postgres:16-alpine
    container_name: faten-sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sonar']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgres_data:
